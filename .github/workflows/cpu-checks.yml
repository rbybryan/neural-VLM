name: CPU smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-smoke.txt
      - name: Check portable dataset paths
        run: python -m unittest discover -s tests -v
      - name: Run all offline synthetic checks
        run: python scripts/run_cpu_smoke.py
